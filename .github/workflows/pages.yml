name: Deploy site

# Fetches the sheet via Sheety and publishes the site to GitHub Pages.
# A fetch costs one Sheety request per team, so only scheduled and manual runs fetch.
on:
  push:
    branches: [main]
  # Daily at 10:10 Swedish time, 10 minutes after the Pi updates the sheet. Cron runs in UTC,
  # so both candidates are scheduled and the gate job keeps the one that is 10:10 in Stockholm
  # (08:10 UTC in summer time, 09:10 UTC in winter time).
  schedule:
    - cron: "10 8 * * *"
    - cron: "10 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(TZ=Europe/Stockholm date +%z)" = "+0200" ]; then want="10 8 * * *"; else want="10 9 * * *"; fi
          if [ "$SCHEDULE" = "$want" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Code pushes reuse the data already live on the site, so they cost no Sheety quota.
      # Scheduled and manual runs fetch fresh data, and fall back to the live copy if Sheety fails.
      - name: Get league data
        run: |
          if [ "$EVENT" != "push" ] && node scripts/fetch-data.mjs data/league.json; then exit 0; fi
          echo "Reusing the data from the live site"
          curl -fsSL "$LIVE_DATA" -o data/league.json
        env:
          EVENT: ${{ github.event_name }}
          LIVE_DATA: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/league.json
          SHEETY_BASE: ${{ secrets.SHEETY_BASE }}
          SHEETY_TOKEN: ${{ secrets.SHEETY_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
