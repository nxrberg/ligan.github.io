name: Deploy site

# Fetches the sheet via Sheety and publishes the site to GitHub Pages.
# Each run costs one Sheety request per team, so keep the schedule modest.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch league data
        run: node scripts/fetch-data.mjs data/league.json
        env:
          SHEETY_BASE: ${{ secrets.SHEETY_BASE }}
          SHEETY_TOKEN: ${{ secrets.SHEETY_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
