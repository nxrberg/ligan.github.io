name: Deploy site

# Publishes the site to GitHub Pages on code pushes and on demand. Data doesn't need a deploy:
# the Pi uploads seasons/<season>.json to the `data` branch after every export and the site reads it on
# page load. The deploy only bakes a copy of that file in as a fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Fallback copy of the data: the Pi's latest upload, else whatever the live site has now.
      - name: Get fallback data
        run: |
          season=$(sed -nE 's/^const season = "([0-9]{4}-[0-9]{2})";.*/\1/p' js/config.js)
          git fetch --depth=1 origin data && git show "FETCH_HEAD:seasons/$season.json" > data/league.json && exit 0
          echo "::warning title=No data branch file::Using the data from the live site instead."
          curl -fsSL "$LIVE_DATA" -o data/league.json
        env:
          LIVE_DATA: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/league.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
