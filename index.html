<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ligan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏒</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand"><span>🏒</span> <h1 id="league">Ligan</h1></div>
    <nav role="tablist">
      <button role="tab" aria-selected="true">Weekly leaderboard</button>
    </nav>
  </header>

  <main>
    <p id="status" class="status" hidden></p>

    <section>
      <div class="row">
        <h2>Weekly leaderboard</h2>
        <div class="controls">
          <label class="toggle"><input type="checkbox" id="show-rank" /> Show category rank</label>
          <select id="week-select" aria-label="Week"></select>
        </div>
      </div>
      <div id="board"></div>
      <div id="notes" class="notes"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
